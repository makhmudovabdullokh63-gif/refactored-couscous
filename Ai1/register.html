<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · CampusAI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="hero">
    <section class="hero-card" style="grid-template-columns:1fr">
      <div class="auth-box" style="max-width:480px;margin:auto">
        <h2>Create a student account</h2>
        <form id="register-form">
          <div class="field"><label for="name">Full name</label><input id="name" name="name" required /></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required /></div>
          <div class="field"><label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" minlength="8" required /></div>
          <div class="field">
            <label for="groupCode">Student group</label>
            <select id="groupCode" name="groupCode">
              <option value="CS-21">CS-21</option>
              <option value="CS-22">CS-22</option>
              <option value="MATH-11">MATH-11</option>
            </select>
          </div>
          <div class="field">
            <label for="language">Language</label>
            <select id="language" name="language">
              <option value="en">English</option>
              <option value="ru">Русский</option>
              <option value="uz">O‘zbekcha</option>
            </select>
          </div>
          <button class="primary" type="submit">Register</button>
        </form>
        <p><a href="/login.html">Already registered?</a></p>
      </div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
